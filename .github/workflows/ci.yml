name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  # 이미지에 들어가는 파일이 바뀔 때만 배포한다. develop은 개발, main은 운영이다.
  push:
    branches: [develop, main]
    paths:
      - "server/**"
      - "src/local_pipeline.py"
      - "src/rules/**"
      - "requirements-*.txt"
      - "Dockerfile"
      - "model.sha256"
      - ".dockerignore"
      - "scripts/build-image.sh"
      - "scripts/check-image.sh"
      - ".github/workflows/ci.yml"
  # 운영 되돌리기. main에서 예전 운영 이미지 태그로 실행한다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 되돌릴 운영 이미지 태그 (prod-<커밋 12자리>)
        type: string
        required: true

# develop 푸시는 푸시 순서대로 하나씩 돌린다. 배포 작업에만 걸면 테스트가 늦게 끝난 이전 커밋이 대기 중인 최신 커밋을 취소한다.
# PR은 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::551372961758:role/dev-cking-filter-github-actions-role
  PROD_ROLE_ARN: arn:aws:iam::551372961758:role/prod-cking-filter-github-actions-role
  ECR_REPOSITORY: 551372961758.dkr.ecr.ap-northeast-2.amazonaws.com/cking-comment-filter
  FUNCTION_NAME: dev-cking-comment-filter
  PROD_FUNCTION_NAME: prod-cking-comment-filter

jobs:
  # 기본 상한(6시간) 동안 멈추면 뒤의 develop 실행이 모두 기다리므로 상한을 둔다.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 단위 테스트는 표준 라이브러리만 쓴다.
      - name: 단위 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t .
      - name: 워크플로 검사
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color

  # PR에서는 이미지를 만들지 않으므로, 이미지와 같은 베이스 이미지·torch·setuptools로 requirements-image.txt를
  # 설치할 수 있는지 의존성 계산만 한다. Dependabot은 고정 목록의 버전 범위를 계산하지 않아 서로 맞지 않는 버전을 올릴 수 있다.
  image-deps:
    name: Image dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 이미지 의존성 계산
        run: |
          BASE=$(sed -n 's/^FROM \(python:[^ ]*\).*/\1/p' Dockerfile)
          INDEX=$(grep -o -- '--index-url [^ ]*' Dockerfile | head -1 | cut -d' ' -f2)
          read -ra PINS <<< "$(grep -oE '(torch|setuptools)==[^ ]+' Dockerfile | tr '\n' ' ')"
          if [ -z "$BASE" ] || [ -z "$INDEX" ] || [ "${#PINS[@]}" -ne 2 ]; then
            echo "::error::Dockerfile에서 베이스 이미지·torch 인덱스·torch·setuptools 고정 버전을 읽지 못했다"
            exit 1
          fi
          echo "베이스 $BASE, $INDEX: ${PINS[*]}"
          docker run --rm -v "$PWD/requirements-image.txt:/w/requirements-image.txt:ro" "$BASE" \
            pip install --quiet --root-user-action=ignore --dry-run --index-url "$INDEX" \
            --extra-index-url https://pypi.org/simple "${PINS[@]}" -r /w/requirements-image.txt

  # 모델 파일은 Git에 없어 개발 배포 버킷에서 받는다. 이 역할은 develop에서만 맡을 수 있어 PR에서는 이미지를 만들지 않는다.
  deploy-dev:
    name: Deploy to dev
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    # Lambda와 같은 arm64에서 바로 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # 배포된 커밋이 이 커밋의 조상인지 보려면 이력이 모두 있어야 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 태그는 커밋이고 덮어쓸 수 없다. 같은 커밋을 다시 실행하면 새로 빌드하지 않고 올려 둔 이미지를 받아 확인한다.
      # 모델 경로는 src/local_pipeline.py의 MODEL_DIR에서 읽고, 모델은 개발 배포 버킷에서 받는다.
      - name: 이미지 준비
        id: image
        run: |
          TAG="${GITHUB_SHA::12}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          if DIGEST=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="$TAG" \
              --query 'imageDetails[0].imageDigest' --output text 2>"$RUNNER_TEMP/ecr.err"); then
            docker pull "$ECR_REPOSITORY@$DIGEST"
            docker tag "$ECR_REPOSITORY@$DIGEST" filter:check
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException "$RUNNER_TEMP/ecr.err"; then
            scripts/build-image.sh filter:check
          else
            cat "$RUNNER_TEMP/ecr.err"
            exit 1
          fi

      - name: 이미지 확인
        run: scripts/check-image.sh filter:check

      - name: ECR 푸시
        id: push
        if: steps.image.outputs.digest == ''
        run: |
          TAG="${GITHUB_SHA::12}"
          docker tag filter:check "$ECR_REPOSITORY:$TAG"
          docker push "$ECR_REPOSITORY:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 개발 Lambda는 이 CI가 올린 첫 이미지로 만든다(URECA-Cking/Cking-Infra#127). 그 전에는 건너뛴다.
      # 배포된 커밋이 이 커밋의 조상이면 교체하고, 이 커밋이 더 오래됐으면(지난 실행의 재시도) 건너뛴다.
      # 둘 다 아니면 이력이 갈라진 것이라 멈춘다. 배포된 이미지에 커밋 태그가 여럿이면(내용이 같은 이미지) 모두 본다.
      - name: 개발 Lambda 이미지 교체
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.image.outputs.digest }}
        run: |
          echo "이미지: $ECR_REPOSITORY:${GITHUB_SHA::12} ($DIGEST)" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! CURRENT=$(aws lambda get-function --function-name "$FUNCTION_NAME" \
              --query Code.ResolvedImageUri --output text 2>"$RUNNER_TEMP/lambda.err"); then
            if grep -q ResourceNotFoundException "$RUNNER_TEMP/lambda.err"; then
              echo "개발 Lambda가 아직 없어 이미지 교체를 건너뛴다" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$RUNNER_TEMP/lambda.err"
            exit 1
          fi
          DEPLOYED=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageDigest="${CURRENT#*@}" \
            --query 'imageDetails[0].imageTags' --output text | tr '\t' '\n' | grep -xE '[0-9a-f]{12}' || true)
          NEWER=""
          while read -r T; do
            if [ -z "$T" ] || ! git rev-parse -q --verify "$T^{commit}" >/dev/null; then
              echo "::error::배포된 이미지 $CURRENT 의 커밋을 확인할 수 없다"
              exit 1
            fi
            if git merge-base --is-ancestor "$T" "$GITHUB_SHA"; then
              continue
            elif git merge-base --is-ancestor "$GITHUB_SHA" "$T"; then
              NEWER="$NEWER $T"
            else
              echo "::error::배포된 커밋 $T 과 이 커밋의 이력이 갈라졌다"
              exit 1
            fi
          done <<< "$DEPLOYED"
          if [ -n "$NEWER" ]; then
            echo "::warning::더 새 커밋$NEWER 이 배포되어 있어 이미지 교체를 건너뛴다"
            echo "더 새 커밋$NEWER 이 배포되어 있어 이미지 교체를 건너뛴다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --image-uri "$ECR_REPOSITORY@$DIGEST" --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          echo "개발 Lambda 이미지 교체: ${DEPLOYED//$'\n'/ } -> ${GITHUB_SHA::12} ($DIGEST)" | tee -a "$GITHUB_STEP_SUMMARY"

  # 운영은 새로 빌드하지 않고 개발 배포로 확인한 이미지를 올린다. 역할은 main에서만 맡을 수 있다.
  deploy-prod:
    name: Deploy to prod
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 이미지에 들어가는 파일이 이 커밋과 같은 개발 커밋의 이미지 중 가장 최근 커밋의 것을 고른다. 개발 CI가 확인하고 올린 이미지다.
      # develop→main을 squash로 합치면 개발 커밋이 main의 조상이 아니므로 이력이 아니라 내용으로 고른다.
      # 그런 이미지가 없으면 develop의 개발 배포가 아직 끝나지 않은 것이라 멈춘다. 수동 실행은 고른 운영 태그를 그대로 쓴다.
      - name: 올릴 이미지 정하기
        id: image
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          REPO="${ECR_REPOSITORY#*/}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$INPUT_TAG" =~ ^prod-[0-9a-f]{12}$ ]]; then
              echo "::error::태그는 prod-<커밋 12자리>다: $INPUT_TAG"
              exit 1
            fi
            DIGEST=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$INPUT_TAG" \
              --query 'imageDetails[0].imageDigest' --output text)
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "수동 되돌리기: $INPUT_TAG ($DIGEST)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          INPUTS=(server src/local_pipeline.py src/rules 'requirements-*.txt' Dockerfile model.sha256 .dockerignore scripts/build-image.sh)
          # shellcheck disable=SC2016 # 백틱은 JMESPath 문자열이다
          IMAGES=$(aws ecr describe-images --repository-name "$REPO" \
            --query 'imageDetails[?imageTags].[imageDigest,join(` `,imageTags)]' --output text)
          BEST="" DIGEST="" BEST_TIME=""
          while IFS=$'\t' read -r D TAGS; do
            for T in $TAGS; do
              [[ "$T" =~ ^[0-9a-f]{12}$ ]] || continue
              git rev-parse -q --verify "$T^{commit}" >/dev/null || continue
              git diff --quiet "$T" "$GITHUB_SHA" -- "${INPUTS[@]}" || continue
              TIME=$(git log -1 --format=%ct "$T")
              if [ -z "$BEST_TIME" ] || [ "$TIME" -gt "$BEST_TIME" ]; then
                BEST="$T" DIGEST="$D" BEST_TIME="$TIME"
              fi
            done
          done <<< "$IMAGES"
          if [ -z "$BEST" ]; then
            echo "::error::이 커밋과 이미지 내용이 같은 개발 이미지가 없다. develop의 개발 배포가 끝난 뒤 main에 합친다"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "올릴 이미지: 개발 커밋 $BEST ($DIGEST)" | tee -a "$GITHUB_STEP_SUMMARY"

      # 개발과 같은 기준이다. 배포된 운영 커밋(prod- 태그)이 이 커밋의 조상이면 교체하고, 더 새로우면 건너뛰고, 갈라졌으면 멈춘다.
      - name: 운영 Lambda 교체 순서 확인
        id: order
        run: |
          if ! CURRENT=$(aws lambda get-function --function-name "$PROD_FUNCTION_NAME" \
              --query Code.ResolvedImageUri --output text 2>"$RUNNER_TEMP/lambda.err"); then
            if grep -q ResourceNotFoundException "$RUNNER_TEMP/lambda.err"; then
              echo "운영 Lambda가 아직 없어 건너뛴다" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/lambda.err"
            exit 1
          fi
          echo "previous=${CURRENT#*@}" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && exit 0
          DEPLOYED=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageDigest="${CURRENT#*@}" \
            --query 'imageDetails[0].imageTags' --output text | tr '\t' '\n' | sed -n 's/^prod-\([0-9a-f]\{12\}\)$/\1/p')
          NEWER=""
          while read -r T; do
            [ -n "$T" ] || continue
            if ! git rev-parse -q --verify "$T^{commit}" >/dev/null; then
              echo "::error::배포된 운영 이미지 $CURRENT 의 커밋을 확인할 수 없다"
              exit 1
            fi
            if git merge-base --is-ancestor "$T" "$GITHUB_SHA"; then
              continue
            elif git merge-base --is-ancestor "$GITHUB_SHA" "$T"; then
              NEWER="$NEWER $T"
            else
              echo "::error::배포된 운영 커밋 $T 과 이 커밋의 이력이 갈라졌다"
              exit 1
            fi
          done <<< "$DEPLOYED"
          if [ -n "$NEWER" ]; then
            echo "::warning::더 새 커밋$NEWER 이 운영에 배포되어 있어 건너뛴다"
            echo "더 새 커밋$NEWER 이 운영에 배포되어 있어 건너뛴다" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # 태그는 덮어쓸 수 없어, 같은 커밋을 다시 실행하면 이미 붙은 태그가 같은 이미지인지만 본다.
      # 매니페스트는 받은 그대로 넣는다. 파일로 쓰면 끝에 줄바꿈이 붙어 digest가 달라지고, --image-digest로 ECR이 다르면 거부한다.
      - name: 운영 태그 붙이기
        if: steps.order.outputs.skip != 'true' && github.event_name == 'push'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          REPO="${ECR_REPOSITORY#*/}"
          TAG="prod-${GITHUB_SHA::12}"
          if EXISTING=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null); then
            [ "$EXISTING" = "$DIGEST" ] || { echo "::error::$TAG 가 다른 이미지($EXISTING)에 붙어 있다"; exit 1; }
            exit 0
          fi
          read -r MEDIA < <(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageManifestMediaType' --output text)
          MANIFEST=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageDigest="$DIGEST" \
            --query 'images[0].imageManifest' --output text)
          aws ecr put-image --repository-name "$REPO" --image-tag "$TAG" --image-manifest "$MANIFEST" \
            --image-manifest-media-type "$MEDIA" --image-digest "$DIGEST" --query 'image.imageId.imageTag' --output text

      - name: 운영 Lambda 이미지 교체
        id: update
        if: steps.order.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          PREVIOUS: ${{ steps.order.outputs.previous }}
        run: |
          aws lambda update-function-code --function-name "$PROD_FUNCTION_NAME" \
            --image-uri "$ECR_REPOSITORY@$DIGEST" --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$PROD_FUNCTION_NAME"
          echo "운영 Lambda 이미지 교체: $PREVIOUS -> $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

      # 함수 URL을 IAM 서명으로 불러 통과·차단을 확인한다. 실패하면 교체 전 이미지로 되돌린다.
      - name: 운영 Lambda 확인
        id: check
        if: steps.order.outputs.skip != 'true'
        run: |
          python3 -m pip install --quiet "botocore==1.43.109"
          URL=$(aws lambda get-function-url-config --function-name "$PROD_FUNCTION_NAME" --query FunctionUrl --output text)
          python3 scripts/check-lambda.py "$URL"

      # 교체 요청 뒤 대기가 실패해도(확인 단계는 건너뛰어진다) 되돌린다. 진행 중인 교체가 있으면 다시 교체할 수 없어 끝나기를 먼저 기다린다.
      - name: 실패 시 이전 이미지로 되돌리기
        if: failure() && (steps.update.outcome == 'failure' || steps.check.outcome == 'failure') && steps.order.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.order.outputs.previous }}
        run: |
          aws lambda wait function-updated-v2 --function-name "$PROD_FUNCTION_NAME" || true
          STATE=$(aws lambda get-function --function-name "$PROD_FUNCTION_NAME" \
            --query '[Configuration.LastUpdateStatus,Code.ResolvedImageUri]' --output text)
          read -r STATUS IMAGE <<< "$STATE"
          if [ "$STATUS" = InProgress ]; then
            echo "::error::이미지 교체가 아직 진행 중이라 되돌리지 못했다. 끝난 뒤 이전 이미지($PREVIOUS)로 되돌린다"
            exit 1
          fi
          if [ "$STATUS" = Successful ] && [ "${IMAGE#*@}" = "$PREVIOUS" ]; then
            echo "::error::이미지 교체가 적용되지 않아 이전 이미지($PREVIOUS) 그대로다"
            exit 0
          fi
          aws lambda update-function-code --function-name "$PROD_FUNCTION_NAME" \
            --image-uri "$ECR_REPOSITORY@$PREVIOUS" --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$PROD_FUNCTION_NAME"
          echo "::error::교체 또는 확인에 실패해 이전 이미지($PREVIOUS)로 되돌렸다"
