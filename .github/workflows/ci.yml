name: CI/CD

on:
  pull_request:
    branches: [develop]
  # 이미지에 들어가는 파일이 바뀔 때만 개발에 배포한다.
  push:
    branches: [develop]
    paths:
      - "server/**"
      - "src/local_pipeline.py"
      - "src/rules/**"
      - "requirements-*.txt"
      - "Dockerfile"
      - "model.sha256"
      - ".dockerignore"
      - "scripts/build-image.sh"
      - "scripts/check-image.sh"
      - ".github/workflows/ci.yml"

# develop 푸시는 푸시 순서대로 하나씩 돌린다. 배포 작업에만 걸면 테스트가 늦게 끝난 이전 커밋이 대기 중인 최신 커밋을 취소한다.
# PR은 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::551372961758:role/dev-cking-filter-github-actions-role
  ECR_REPOSITORY: 551372961758.dkr.ecr.ap-northeast-2.amazonaws.com/cking-comment-filter
  FUNCTION_NAME: dev-cking-comment-filter

jobs:
  # 기본 상한(6시간) 동안 멈추면 뒤의 develop 실행이 모두 기다리므로 상한을 둔다.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 단위 테스트는 표준 라이브러리만 쓴다.
      - name: 단위 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t .
      - name: 워크플로 검사
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color

  # 모델 파일은 Git에 없어 개발 배포 버킷에서 받는다. 이 역할은 develop에서만 맡을 수 있어 PR에서는 이미지를 만들지 않는다.
  deploy-dev:
    name: Deploy to dev
    needs: test
    if: github.event_name == 'push'
    # Lambda와 같은 arm64에서 바로 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # 배포된 커밋이 이 커밋의 조상인지 보려면 이력이 모두 있어야 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 태그는 커밋이고 덮어쓸 수 없다. 같은 커밋을 다시 실행하면 새로 빌드하지 않고 올려 둔 이미지를 받아 확인한다.
      # 모델 경로는 src/local_pipeline.py의 MODEL_DIR에서 읽고, 모델은 개발 배포 버킷에서 받는다.
      - name: 이미지 준비
        id: image
        run: |
          TAG="${GITHUB_SHA::12}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          if DIGEST=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="$TAG" \
              --query 'imageDetails[0].imageDigest' --output text 2>"$RUNNER_TEMP/ecr.err"); then
            docker pull "$ECR_REPOSITORY@$DIGEST"
            docker tag "$ECR_REPOSITORY@$DIGEST" filter:check
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException "$RUNNER_TEMP/ecr.err"; then
            scripts/build-image.sh filter:check
          else
            cat "$RUNNER_TEMP/ecr.err"
            exit 1
          fi

      - name: 이미지 확인
        run: scripts/check-image.sh filter:check

      - name: ECR 푸시
        id: push
        if: steps.image.outputs.digest == ''
        run: |
          TAG="${GITHUB_SHA::12}"
          docker tag filter:check "$ECR_REPOSITORY:$TAG"
          docker push "$ECR_REPOSITORY:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 개발 Lambda는 이 CI가 올린 첫 이미지로 만든다(URECA-Cking/Cking-Infra#127). 그 전에는 건너뛴다.
      # 배포된 커밋이 이 커밋의 조상이면 교체하고, 이 커밋이 더 오래됐으면(지난 실행의 재시도) 건너뛴다.
      # 둘 다 아니면 이력이 갈라진 것이라 멈춘다. 배포된 이미지에 커밋 태그가 여럿이면(내용이 같은 이미지) 모두 본다.
      - name: 개발 Lambda 이미지 교체
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.image.outputs.digest }}
        run: |
          echo "이미지: $ECR_REPOSITORY:${GITHUB_SHA::12} ($DIGEST)" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! CURRENT=$(aws lambda get-function --function-name "$FUNCTION_NAME" \
              --query Code.ResolvedImageUri --output text 2>"$RUNNER_TEMP/lambda.err"); then
            if grep -q ResourceNotFoundException "$RUNNER_TEMP/lambda.err"; then
              echo "개발 Lambda가 아직 없어 이미지 교체를 건너뛴다" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$RUNNER_TEMP/lambda.err"
            exit 1
          fi
          DEPLOYED=$(aws ecr describe-images --repository-name "${ECR_REPOSITORY#*/}" --image-ids imageDigest="${CURRENT#*@}" \
            --query 'imageDetails[0].imageTags' --output text | tr '\t' '\n' | grep -xE '[0-9a-f]{12}' || true)
          NEWER=""
          while read -r T; do
            if [ -z "$T" ] || ! git rev-parse -q --verify "$T^{commit}" >/dev/null; then
              echo "::error::배포된 이미지 $CURRENT 의 커밋을 확인할 수 없다"
              exit 1
            fi
            if git merge-base --is-ancestor "$T" "$GITHUB_SHA"; then
              continue
            elif git merge-base --is-ancestor "$GITHUB_SHA" "$T"; then
              NEWER="$NEWER $T"
            else
              echo "::error::배포된 커밋 $T 과 이 커밋의 이력이 갈라졌다"
              exit 1
            fi
          done <<< "$DEPLOYED"
          if [ -n "$NEWER" ]; then
            echo "::warning::더 새 커밋$NEWER 이 배포되어 있어 이미지 교체를 건너뛴다"
            echo "더 새 커밋$NEWER 이 배포되어 있어 이미지 교체를 건너뛴다" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --image-uri "$ECR_REPOSITORY@$DIGEST" --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          echo "개발 Lambda 이미지 교체: ${DEPLOYED//$'\n'/ } -> ${GITHUB_SHA::12} ($DIGEST)" | tee -a "$GITHUB_STEP_SUMMARY"
