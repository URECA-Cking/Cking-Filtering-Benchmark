name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  # 이미지에 들어가는 파일과 이미지 확인·배포 스크립트, 이 워크플로가 바뀔 때만 배포한다. develop은 개발, main은 운영이다.
  push:
    branches: [develop, main]
    paths:
      - "server/**"
      - "src/local_pipeline.py"
      - "src/rules/**"
      - "requirements-*.txt"
      - "Dockerfile"
      - "model.sha256"
      - ".dockerignore"
      - "scripts/build-image.sh"
      - "scripts/check-image.sh"
      - "scripts/deploy/**"
      - ".github/workflows/ci.yml"
  # 운영 되돌리기. main에서 예전 운영 이미지 태그로 실행한다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 되돌릴 운영 이미지 태그 (prod-<커밋 12자리>)
        type: string
        required: true

# develop·main 푸시는 브랜치마다 하나씩 돌린다. 대기 중인 실행은 새 푸시가 오면 취소되고 새 실행이 대신한다. 배포 작업에만 걸면 테스트가 늦게 끝난 이전 커밋이 대기 중인 최신 커밋을 취소한다.
# PR은 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::551372961758:role/dev-cking-filter-github-actions-role
  PROD_ROLE_ARN: arn:aws:iam::551372961758:role/prod-cking-filter-github-actions-role
  ECR_REPOSITORY: 551372961758.dkr.ecr.ap-northeast-2.amazonaws.com/cking-comment-filter
  FUNCTION_NAME: dev-cking-comment-filter
  PROD_FUNCTION_NAME: prod-cking-comment-filter

jobs:
  # 기본 상한(6시간) 동안 멈추면 뒤의 develop 실행이 모두 기다리므로 상한을 둔다.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 단위 테스트는 표준 라이브러리만 쓴다.
      - name: 단위 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -t .
      - name: 워크플로 검사
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color
      # 배포 단계 셸은 scripts/deploy로 옮겨 actionlint가 검사하지 않으므로 같은 이미지의 shellcheck로 검사한다.
      - name: 배포 스크립트 검사
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo --entrypoint shellcheck
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          scripts/deploy/*.sh

  # PR에서는 이미지를 만들지 않으므로, 이미지와 같은 베이스 이미지·torch·setuptools로 requirements-image.txt를
  # 설치할 수 있는지 의존성 계산만 한다. Dependabot은 고정 목록의 버전 범위를 계산하지 않아 서로 맞지 않는 버전을 올릴 수 있다.
  image-deps:
    name: Image dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 이미지 의존성 계산
        run: |
          BASE=$(sed -n 's/^FROM \(python:[^ ]*\).*/\1/p' Dockerfile)
          INDEX=$(grep -o -- '--index-url [^ ]*' Dockerfile | head -1 | cut -d' ' -f2)
          read -ra PINS <<< "$(grep -oE '(torch|setuptools)==[^ ]+' Dockerfile | tr '\n' ' ')"
          if [ -z "$BASE" ] || [ -z "$INDEX" ] || [ "${#PINS[@]}" -ne 2 ]; then
            echo "::error::Dockerfile에서 베이스 이미지·torch 인덱스·torch·setuptools 고정 버전을 읽지 못했다"
            exit 1
          fi
          echo "베이스 $BASE, $INDEX: ${PINS[*]}"
          docker run --rm -v "$PWD/requirements-image.txt:/w/requirements-image.txt:ro" "$BASE" \
            pip install --quiet --root-user-action=ignore --dry-run --index-url "$INDEX" \
            --extra-index-url https://pypi.org/simple "${PINS[@]}" -r /w/requirements-image.txt

  # 모델 파일은 Git에 없어 개발 배포 버킷에서 받는다. 이 역할은 develop에서만 맡을 수 있어 PR에서는 이미지를 만들지 않는다.
  deploy-dev:
    name: Deploy to dev
    needs: test
    # 저장소 변수 DEPLOY_ENABLED가 true일 때만 배포한다. 배포할 서버가 없을 때는 변수를 지워 검사만 돌린다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEPLOY_ENABLED == 'true'
    # Lambda와 같은 arm64에서 바로 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # 배포된 커밋이 이 커밋의 조상인지 보려면 이력이 모두 있어야 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 이미지 준비
        id: image
        run: scripts/deploy/prepare-dev-image.sh

      - name: 이미지 확인
        run: scripts/check-image.sh filter:check

      - name: ECR 푸시
        id: push
        if: steps.image.outputs.digest == ''
        run: scripts/deploy/push-dev-image.sh

      - name: 개발 Lambda 이미지 교체
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.image.outputs.digest }}
        run: scripts/deploy/update-dev-lambda.sh

  # 운영은 새로 빌드하지 않고 개발 배포로 확인한 이미지를 올린다. 역할은 main에서만 맡을 수 있다.
  deploy-prod:
    name: Deploy to prod
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 올릴 이미지 정하기
        id: image
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: scripts/deploy/pick-prod-image.sh

      - name: 운영 Lambda 교체 순서 확인
        id: order
        run: scripts/deploy/check-prod-order.sh

      - name: 운영 태그 붙이기
        if: steps.order.outputs.skip != 'true' && github.event_name == 'push'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/deploy/tag-prod-image.sh

      - name: 운영 Lambda 이미지 교체
        id: update
        if: steps.order.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          PREVIOUS: ${{ steps.order.outputs.previous }}
        run: |
          aws lambda update-function-code --function-name "$PROD_FUNCTION_NAME" \
            --image-uri "$ECR_REPOSITORY@$DIGEST" --query LastUpdateStatus --output text
          aws lambda wait function-updated-v2 --function-name "$PROD_FUNCTION_NAME"
          echo "운영 Lambda 이미지 교체: $PREVIOUS -> $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"

      # 함수 URL을 IAM 서명으로 불러 통과·차단을 확인한다. 실패하면 교체 전 이미지로 되돌린다.
      - name: 운영 Lambda 확인
        id: check
        if: steps.order.outputs.skip != 'true'
        run: |
          python3 -m pip install --quiet "botocore==1.43.109"
          URL=$(aws lambda get-function-url-config --function-name "$PROD_FUNCTION_NAME" --query FunctionUrl --output text)
          python3 scripts/check-lambda.py "$URL"

      # 교체 요청 뒤 대기가 실패해도(확인 단계는 건너뛰어진다) 되돌린다.
      - name: 실패 시 이전 이미지로 되돌리기
        if: failure() && (steps.update.outcome == 'failure' || steps.check.outcome == 'failure') && steps.order.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.order.outputs.previous }}
        run: scripts/deploy/rollback-prod-lambda.sh
