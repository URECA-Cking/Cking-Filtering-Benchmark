# 비교 실험 설정 초안. 무료로 쓸 수 있는 후보를 우선한다.
# 모델 ID·제공 상태·무료 한도·요금은 실행 직전에 공식 문서로 다시 확인하고, 확인하지 않은 값은 null로 둔다.
# 단가가 null인 유료 모델은 실행하지 않는다. 무료 후보도 호출 상한(max_calls)을 둔다.
dataset:
  path: data/samples.jsonl
  schema: data/comments.schema.json
  only_review_status: approved
run:
  repeat: 1
  timeout_seconds: 10
  prompt_version: pilot-v1
models:
  - id: omni-moderation-latest
    kind: moderation_api          # 판정 전용 분류기. LLM이 아니다
    provider: openai
    api_key_environment_variable: OPENAI_API_KEY
    cost: free
    covers: [ABUSE, HATE]         # 분류 항목에 스팸·개인정보가 없다. 해당 유형은 '미지원'으로 따로 집계한다
    max_calls: 500
    verified_on: 2026-10-01       # 소량 호출(7건)로 응답 형식·오류·응답 시간 확인. 요금·한도는 공식 문서 확인 필요
candidates_deferred:
  - id: gemini-flash                # Gemini flash 계열 (무료 한도)
    reason: 2026-10-01 호출 결과 2.5 계열은 404(신규 사용자에게 제공 안 됨), 3.x 계열은 결제 필요(402). 무료로 쓸 수 없다
  - id: local-korean-classifier   # KcELECTRA 등을 K-HATERS·K-MHaS로 미세조정한 로컬 모델
    reason: 학습 데이터 라이선스 확인과 미세조정이 필요하다. 혐오·모욕만 다룬다
  - id: paid-small-llm            # 무료 한도가 부족할 때만 호출 상한과 단가를 정해 추가한다
    reason: 비용 상한 확정 전에는 실행하지 않는다
